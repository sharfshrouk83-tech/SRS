<!DOCTYPE html>
<html lang="en">
<head>

<title>Rings | SRS Accessories</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;

body{

color:#fff;
}

header{
background:#111;
padding:20px;
text-align:center;

}

.gallery{

}

.card{
width:230px;
background:#111;
border:2px solid deeppink;

overflow:hidden;
text-align:center;
}

.card img{
width:100%;
height:230px;
object-fit:cover;
}

.card h3{

margin:15px 0 10px;
}

.price{
font-size:18px;
margin-bottom:10px;
}

button{
background:deeppink;

padding:10px 20px;

margin-bottom:20px;
cursor:pointer;
}
</style>
