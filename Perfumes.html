<!DOCTYPE html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perfumes | SRS Accessories</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#000;
color:#fff;
}

header{
background:#111;
padding:20px;
text-align:center;
border-bottom:2px solid deeppink;

}

.back{
display:inline-block;

}

.back:hover{

}

.gallery{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:25px;

}

.card{

background:#111;
border:2px solid deeppink;
border-radius:20px;
overflow:hidden;
text-align:center;
transition:.3s;
}

.card:hover{
transform:scale(1.05);
}

.card img{
width:100%;
height:250px;
object-fit:cover;
}

.card h3{
color:deeppink;
margin:15px 0 10px;
}

.card p{
margin-bottom:15px;
font-size:20px;
}

button{
background:deeppink;
color:white;
border:none;
padding:10px 25px;
border-radius:25px;
margin-bottom:20px;
cursor:pointer;
}

button:hover{
background:#ff4fa3;
}
</style>
</head>
